<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Collaborative Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        h1 {
            color: #0066cc;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #004999;
        }
    </style>
</head>
<body>

    <h1>Welcome to Our Collaborative App!</h1>
    <p>This website was built together using Git and GitHub.</p>
    
    <button onclick="showAlert()">Click Me!</button>

    <script>
        function showAlert() {
            alert("Hello! Teamwork makes the dream work.");
        }
    </script>

</body>
</html>
